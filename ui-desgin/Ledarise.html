<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ledarise — Premium Hair Replacement</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=DM+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="data.js"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="shared.jsx"></script>
<script type="text/babel" src="store-home.jsx"></script>
<script type="text/babel" src="store-shop.jsx"></script>
<script type="text/babel" src="store-checkout.jsx"></script>
<script type="text/babel" src="admin-shell.jsx"></script>
<script type="text/babel" src="admin-dashboard.jsx"></script>
<script type="text/babel" src="admin-orders.jsx"></script>
<script type="text/babel" src="admin-products.jsx"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="env,react">
const { useState, useEffect } = React;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accent": "#b8895c",
  "darkAdmin": false
}/*EDITMODE-END*/;

function parseHash() {
  const h = window.location.hash.slice(1) || '/';
  const [path, qs] = h.split('?');
  const query = {};
  if (qs) qs.split('&').forEach(kv => {
    const [k, v] = kv.split('=');
    query[decodeURIComponent(k)] = decodeURIComponent(v || '');
  });
  return { path, query };
}

function App() {
  const [{ path, query }, setRoute] = useState(parseHash());
  const [darkAdmin, setDarkAdmin] = useState(false);

  useEffect(() => {
    const onHash = () => { setRoute(parseHash()); window.scrollTo(0, 0); };
    window.addEventListener('hashchange', onHash);
    return () => window.removeEventListener('hashchange', onHash);
  }, []);

  const navigate = (to) => { window.location.hash = to; };

  // Storefront
  if (path === '/' || path === '/home') return <window.StoreHome navigate={navigate}/>;
  if (path === '/shop') return <window.StoreShop navigate={navigate} query={query}/>;
  if (path.startsWith('/product/')) return <window.StoreProduct navigate={navigate} productId={path.split('/')[2]}/>;
  if (path === '/cart') return <window.StoreCart navigate={navigate}/>;
  if (path === '/checkout') return <window.StoreCheckout navigate={navigate}/>;
  if (path === '/order-success') return <window.StoreOrderSuccess navigate={navigate} query={query}/>;

  // Admin
  if (path === '/admin' || path === '/admin/login') return <window.AdminLogin navigate={navigate} dark={darkAdmin} setDark={setDarkAdmin}/>;
  if (path === '/admin/dashboard') return <window.AdminDashboard navigate={navigate} dark={darkAdmin} setDark={setDarkAdmin}/>;
  if (path === '/admin/orders') return <window.AdminOrders navigate={navigate} dark={darkAdmin} setDark={setDarkAdmin} query={query}/>;
  if (path.startsWith('/admin/orders/')) return <window.AdminOrderDetail navigate={navigate} dark={darkAdmin} setDark={setDarkAdmin} orderId={path.split('/')[3]}/>;
  if (path === '/admin/products') return <window.AdminProducts navigate={navigate} dark={darkAdmin} setDark={setDarkAdmin} query={query}/>;
  if (path === '/admin/customers') return <window.AdminCustomers navigate={navigate} dark={darkAdmin} setDark={setDarkAdmin}/>;
  if (path.startsWith('/admin/customers/')) return <window.AdminCustomerDetail navigate={navigate} dark={darkAdmin} setDark={setDarkAdmin} customerId={path.split('/')[3]}/>;

  // 404 / index
  return <window.StoreHome navigate={navigate}/>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
